<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Lucky Chand Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #f8f9fa;
      color: #212529;
    }
    .contact-form {
      background: white;
      padding: 20px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">🍎 Lucky Chand Shop</a>
    <div class="btn-group">
      <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Contact</button>
      <ul class="dropdown-menu dropdown-menu-dark">
        <li><a class="dropdown-item" href="index.html">Home</a></li>
        <li><a class="dropdown-item" href="f-endca2.1.html">Fruit Section</a></li>
        <li><a class="dropdown-item" href="f-endca3.html">Special Offers</a></li>
        <li><a class="dropdown-item" href="f-endca4.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Contact Form -->
<div class="container my-5">
  <h2 class="text-center text-dark">📞 Contact Us</h2>
  <p class="text-center">Your thoughts matter to us! Whether you have questions, feedback, or just want to say hello, we’d love to hear from you. Let’s stay connected! 😊</p>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="contact-form">
        <form>
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" required data-bs-toggle="tooltip" title="Please enter your full name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email" required data-bs-toggle="tooltip" title="We'll use this to reply to you">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" placeholder="Enter your message" required data-bs-toggle="tooltip" title="Let us know how we can help you!"></textarea>
          </div>
          <button type="submit" class="btn btn-warning w-100" data-bs-toggle="tooltip" title="Click to send us your message!">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">&copy; 2025 Lucky Chand Shop. All Rights Reserved.</p>
</footer>

<!-- Tooltip Initialization Script -->
<script>
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
  const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
</script>

</body>
</html>
